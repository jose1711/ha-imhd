get_departures:
  fields:
    stop_id:
      required: true
      example: "341"
      selector:
        text:
    lines:
      example: "9, 39"
      selector:
        text:
    platforms:
      example: "837"
      selector:
        text:
    limit:
      default: 10
      selector:
        number:
          min: 1
          max: 100
          mode: box
    timeout:
      default: 10
      selector:
        number:
          min: 2
          max: 60
          unit_of_measurement: s
          mode: box
    settle:
      default: 2
      selector:
        number:
          min: 0
          max: 30
          step: 0.5
          unit_of_measurement: s
          mode: box
